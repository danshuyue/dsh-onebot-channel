# dsh-qq-bridge 的 bundle 补丁层：把本插件作为一行插件插进 profile 的条目列表。
# name 必须写【裸包名】dsh-qq-bridge，不能写子路径。
# id 是插件实例 id（同一插件可插多行，各自有独立配置）。
#
# ⚠️ 这个 name 必须跟三处完全一致，否则插件加载不了：
#   1. package.json 的 "name"
#   2. lib/index.js 导出的 name（cordis 插件名）
#   3. 插件目录名（DSH 按目录名去 node_modules 里找包）
# DSH 的包定位（nearestPackage）会校验 package.json 的 name 等于目录名，
# 对不上就跳过这个包 —— 浏览器侧没有 client bundle，设置页就没入口了。
- insert:
    - id: qq-bridge
      name: dsh-qq-bridge
